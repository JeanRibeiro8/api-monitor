services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: api_monitor
      POSTGRES_USER: api_monitor
      POSTGRES_PASSWORD: api_monitor_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_monitor -d api_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
